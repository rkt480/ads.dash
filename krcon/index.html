<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111a2b">
  <title>KRCON Dashboard Ads · Publiai Ads</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #171d27;
      --navy-soft: #222b38;
      --ink: #1c2532;

    html { min-width: 320px; background: var(--canvas); }

    .spend-legend { display: grid; gap: 12px; margin-top: 16px; }

    @keyframes modal-in { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; padding: 20px 21px 16px; border-bottom: 1px solid #eef1f5; }
    .modal-title { margin: 0; color: #25334a; font-size: 17px; font-weight: 700; letter-spacing: -.025em; }
    .modal-subtitle { margin: 6px 0 0; color: #8a96a8; font-size: 10px; }
    .modal-close { color: #8995a6; }
    .modal-body { padding: 17px 21px 21px; }
    .modal-kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .modal-kpi { padding: 12px; border: 1px solid #edf0f5; border-radius: 10px; background: #fbfcfe; }
    .modal-kpi span { display: block; color: #8793a5; font-size: 9px; }
    .modal-kpi strong { display: block; margin-top: 6px; color: #27364d; font-size: 18px; font-weight: 710; letter-spacing: -.035em; }
    .modal-explainer { margin: 14px 0 0; padding: 12px; border-radius: 9px; color: #6c7990; background: #f4f7fc; font-size: 10px; line-height: 1.55; }
    .toast { position: fixed; right: 24px; bottom: 23px; z-index: 80; display: flex; align-items: center; gap: 8px; padding: 11px 14px; border: 1px solid #dce8e2; border-radius: 10px; color: #39785f; background: #fff; box-shadow: 0 8px 24px rgba(20,34,56,.1); font-size: 11px; animation: modal-in .15s ease-out; }
    .toast svg { width: 15px; height: 15px; }
    .sidebar-overlay { display: none; }
    /* Refined visual system: restrained color, quieter surfaces, clearer hierarchy. */
    .sidebar { background: #171d27; border-right: 1px solid #252d38; }
    .collapse-sidebar { border-color: rgba(216,226,240,.18); color: #9ba7b7; }
    .account-switch { border-color: rgba(216,226,240,.11); border-radius: 7px; background: rgba(255,255,255,.025); }
    .nav-group { margin-bottom: 23px; }
    .nav-item { min-height: 38px; border-radius: 6px; color: #aeb8c6; }
    .nav-item:hover { background: rgba(255,255,255,.045); }
    .nav-item.active { border-color: transparent; color: #f6f8fb; background: #252e3b; box-shadow: inset 2px 0 #83a3cb; }
    .nav-item.active svg { color: #a9bfdc; }
    .demo-note { border-color: rgba(216,226,240,.1); border-radius: 7px; background: rgba(255,255,255,.025); }
    .demo-note svg { color: #9aabc1; }
    .topbar { min-height: 64px; border-bottom-color: #e5e8ec; background: rgba(255,255,255,.96); }
    .page-content { max-width: 1500px; padding-top: 31px; }
    h1 { font-size: clamp(25px, 2.15vw, 29px); font-weight: 690; letter-spacing: -.035em; }
    .page-description { color: #77818e; }
    .demo-pill { gap: 7px; padding: 4px 0; border: 0; border-radius: 0; color: #87919d; background: transparent; font-size: 9px; font-weight: 650; letter-spacing: .095em; }
    .sample-dot { width: 6px; height: 6px; border-radius: 50%; background: #b18a4b; }
    .filter-chip { min-height: 29px; border-radius: 5px; color: #626e7d; }
    .filter-chip.active { border-color: #d2dce8; color: #365d8d; background: #edf2f8; }
    .filter-chip .chip-dot.meta { background: #6685b3; }
    .filter-chip .chip-dot.google { background: #bb8750; }
    .card { border-color: #e5e8ec; border-radius: 9px; box-shadow: var(--shadow); }
    .metric-card { min-height: 126px; padding: 17px 17px 13px; }
    .metric-card:after { display: none; }
    .metric-icon, .metric-icon.green, .metric-icon.purple, .metric-icon.amber { border-radius: 7px; color: #66798e; background: #f1f3f5; }
    .metric-title { color: #788391; font-size: 10px; }
    .metric-value { color: #1d2734; font-size: clamp(22px, 1.9vw, 26px); font-weight: 690; letter-spacing: -.035em; }
    .metric-change { color: #438268; }
    .metric-foot, .metric-split { color: #87919d; }
    .insight-banner { gap: 0; padding: 13px 16px; border: 1px solid #e4e8ed; border-left: 3px solid #6482aa; border-radius: 7px; background: #fff; }
    .insight-copy strong { color: #3b4654; font-size: 11px; }
    .insight-copy p { color: #697584; }
    .insight-copy b { color: #303b49; font-weight: 650; }
    .chart-card, .spend-card { padding: 18px; }
    .card-title { color: #2a3543; font-size: 12px; font-weight: 660; }
    .card-subtitle { color: #89939f; }
    .legend-dot { background: #5f7fa8; }
    .legend-dot.google { background: #ba8751; }
    .chart-line-meta { stroke: #5f7fa8; }
    .chart-line-google { stroke: #ba8751; }
    .chart-fill-meta { display: none; }
    .stacked-meta { background: #5f7fa8; }
    .stacked-google { background: #ba8751; }
    .spend-total { font-size: 24px; font-weight: 690; }
    .table-card { border-radius: 9px; }
    .table-card .card-heading { padding: 16px 17px 13px; }
    thead { background: #f8f9fa; }
    th { color: #818c99; font-size: 9px; font-weight: 650; }
    td { color: #586576; }
    tbody tr.campaign-row:hover { background: #f8f9fb; }
    .campaign-name, .td-strong { color: #303b49; }
    .platform-badge { border-radius: 4px; color: #456b9e; background: #edf2f8; }
    .platform-badge.google { color: #906a3d; background: #f6f1e9; }
    .platform-badge .mini-dot { background: #6685b3; }
    .platform-badge.google .mini-dot { background: #ba8751; }
    .status-badge { color: #4f806d; }
    .status-badge.paused { color: #94794f; }
    .text-button { color: #4a6d9b; }
    .search-field, .toolbar-select, .select-control { border-color: #dfe4e9; border-radius: 6px; }
    .compare-intro { border-color: #e4e8ed; border-radius: 7px; background: #fff; }
    .compare-card { padding: 17px; }
    .delta-pill { border-radius: 4px; color: #477660; background: #eef4f0; }
    .delta-pill.neutral { color: #687482; background: #f1f2f4; }
    .modal-backdrop { background: rgba(20, 27, 38, .44); }
    .campaign-modal { border-radius: 11px; }
    .toast { border-radius: 7px; color: #47745f; }

    @media (max-width: 1200px) {
      .sidebar { width: 226px; }
      .main-area { margin-left: 226px; }
      .metric-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .overview-grid { grid-template-columns: minmax(0,1.4fr) minmax(250px,.85fr); }
      .topbar { padding-right: 23px; padding-left: 23px; }
      .page-content { padding-right: 23px; padding-left: 23px; }
    }
    @media (max-width: 900px) {
      .sidebar { width: 252px; transform: translateX(-102%); box-shadow: 18px 0 40px rgba(12,22,39,.16); }
      .sidebar.mobile-open { transform: translateX(0); }
      .sidebar.collapsed { width: 252px; padding: 22px 15px 16px; }
      .sidebar.collapsed .account-copy, .sidebar.collapsed .account-switch > svg, .sidebar.collapsed .nav-label, .sidebar.collapsed .nav-item span, .sidebar.collapsed .demo-note > div, .sidebar.collapsed .sidebar-footer, .sidebar.collapsed .collapse-sidebar { display: initial; }
      .sidebar.collapsed .brand { display: flex; }
      .sidebar.collapsed .brand-row { justify-content: space-between; }
      .sidebar.collapsed .brand { justify-content: flex-start; }
      .sidebar.collapsed .account-switch { justify-content: space-between; padding: 11px 10px; }
      .sidebar.collapsed .account-switch { display: flex; }
      .sidebar.collapsed nav { display: block; margin-top: 0; }
      .sidebar.collapsed .sidebar-spacer { display: block; flex: 1; }
      .sidebar.collapsed .demo-note { display: flex; }
      .sidebar.collapsed .sidebar-footer { display: block; }
      .sidebar.collapsed .nav-item { justify-content: flex-start; gap: 11px; padding: 0 10px; }
      .sidebar.collapsed .platform-dot { margin: 0 4px; }
      .sidebar.collapsed .demo-note { justify-content: flex-start; padding: 11px 10px; }
      .main-area, .sidebar.collapsed ~ .main-area { margin-left: 0; }
      .mobile-menu { display: inline-grid; }
      .collapse-sidebar { display: none; }
      .sidebar.collapsed .collapse-sidebar { display: none; }
      .sidebar-overlay.visible { position: fixed; inset: 0; z-index: 25; display: block; background: rgba(12, 20, 34, .36); }
      .overview-grid { grid-template-columns: 1fr; }
      .spend-card { min-height: 0; }
      .spend-legend { grid-template-columns: repeat(2,1fr); }
    }
    @media (max-width: 640px) {
      .topbar { min-height: 60px; gap: 8px; padding: 0 14px; }
      .topbar-right { gap: 6px; }
      .period-label, .refresh-button span, .breadcrumb { display: none; }
      .select-control { min-height: 34px; max-width: 150px; font-size: 10px; }
      .refresh-button { width: 34px; justify-content: center; padding: 0; }
      .page-content { padding: 22px 14px 34px; }
      .page-heading { flex-direction: column; gap: 10px; margin-bottom: 17px; }
      .demo-pill { margin-top: 0; }
      .metric-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; }
      .metric-card { min-height: 124px; padding: 13px 12px 11px; }
      .metric-value { font-size: 21px; }
      .metric-foot { align-items: flex-start; flex-direction: column; gap: 4px; }
      .overview-grid { gap: 10px; }
      .chart-card, .spend-card { padding: 14px 13px; }
      .chart-legend { gap: 8px; font-size: 9px; }
      .chart-wrap svg { min-height: 150px; }
      .spend-legend { grid-template-columns: 1fr; }
      .filter-row { gap: 7px; }
      .filter-context { width: 100%; }
      .compare-grid { grid-template-columns: 1fr; }
      .compare-intro { align-items: flex-start; flex-direction: column; }
      .table-card .card-heading { padding-right: 13px; padding-left: 13px; }
      .table-meta { align-items: flex-start; flex-direction: column; padding-right: 13px; padding-left: 13px; }
      .campaign-toolbar { align-items: stretch; }
      .search-field { flex-basis: 100%; }
      .toolbar-select { flex: 1; }
      .compare-values { gap: 7px; }
      .compare-value { font-size: 19px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *:before, *:after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body data-account-name="KRCON Empreendimentos" data-client-brand="KRCON Dashboard Ads">

        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 10 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <nav>
        <div class="nav-group">
          <p class="nav-label">Painel</p>
          <button class="nav-item active" type="button" data-action="navigate" data-view="overview" data-nav="overview" title="Visão geral">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.7"/><rect x="13.5" y="3.5" width="7" height="4" rx="1.4" stroke="currentColor" stroke-width="1.7"/><rect x="13.5" y="10.5" width="7" height="10" rx="1.4" stroke="currentColor" stroke-width="1.7"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.7"/></svg><span>Visão geral</span>

          </button>

        <div class="nav-group">

          <p class="nav-label">Análise</p>
